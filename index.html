<!DOCTYPE html>
<html lang="en">
<head>
    <title>FSS Portal Login</title>
    <link href="login.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
</head>

<body>
    <div class="login-page">

        <!-- LEFT SIDE: Building image -->
        <div class="login-image">
            <img src="fss_clear.jpg" alt="Federal School of Surveying building">
        </div>

        <!-- RIGHT SIDE: Logo + Form -->
        <div class="login-form-side">

            <div class="schoolLogoandText">
                <div class="logo">
                    <img src="FSS_LOGO.png" alt="FSS OYO LOGO">
                </div>
                <h3>Federal School of Surveying</h3>
                <p>Oyo, Nigeria</p>
            </div>

            <form class="login-portal-form">
                <div class="input-group">
                    <input type="text" id="fID" name="fID" placeholder="Staff/Student ID" required>
                </div>

                <div class="input-group">
                    <input type="password" id="password" name="password" placeholder="Password" required>
                </div>

                <div class="forgot-password">
                    <a href="#">Forgot Password?</a>
                </div>

                <div class="form-submit">
                    <input type="submit" value="LOGIN">
                </div>
            </form>

        </div>
    </div>
</body>
</html>
